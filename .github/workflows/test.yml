name: test

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m compileall -q src scripts tests plugin_entry.py
      - run: PYTHONPATH=src python -m unittest discover -s tests
